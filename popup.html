<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Prompt Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Gear icon — always in top-right of popup, hidden when on settings screen -->
    <button id="settings-btn">⚙️</button>

    <div id="main-screen">

      <!-- INTENT FALLBACK — shown when popup is opened without a pre-filled intent -->
      <div id="intent-fallback-section">
        <h1>Craft your perfect prompt.</h1>
        <input
          type="text"
          id="fallback-intent-input"
          placeholder="What do you want to do?"
          autocomplete="off"
        />
        <button id="fallback-start-btn" disabled>Continue →</button>
      </div>

      <!-- QUESTION SECTION -->
      <div id="question-section" style="display:none">
        <button id="on-back-btn" class="back-btn">← Back</button>

        <!-- Shown while AI generates questions -->
        <div id="questions-loading" style="display:none">
          <div class="spinner"></div>
          <p>🤔 Thinking of the best questions for you...</p>
        </div>

        <p id="progress-text">Question 1 of 4</p>
        <p id="question-text"></p>
        <div id="options-container"></div>
      </div>

      <!-- ANYTHING ELSE SECTION -->
      <div id="anything-else-section" style="display:none">
        <button id="anything-else-back-btn" class="back-btn">← Back</button>
        <h2>Anything else you want to add?</h2>
        <p class="section-subtext">Optional — skip if you're good.</p>
        <textarea
          id="extra-input"
          placeholder="e.g. make it look vintage, add fog, no people..."
        ></textarea>
        <button id="to-summary-btn">Looks good? →</button>
      </div>

      <!-- SUMMARY SECTION -->
      <div id="summary-section" style="display:none">
        <button id="summary-back-btn" class="back-btn">← Back</button>
        <h2>Here's what you picked:</h2>
        <div id="summary-content"></div>
        <button id="generate-btn">✨ Generate My Prompt</button>

        <!-- Shown after Gemini returns the finished prompt -->
        <div id="result-section" style="display:none">
          <h3>Your Prompt:</h3>
          <div id="generated-prompt"></div>
          <button id="copy-btn">📋 Copy Prompt</button>
          <small id="copy-confirmation" style="display:none">✅ Copied!</small>
        </div>
      </div>

    </div>

    <!-- Settings screen: hidden by default -->
    <div id="settings-screen">
      <button id="back-from-settings-btn">← Back</button>
      <h2>API Key Settings</h2>
      <input
        type="password"
        id="api-key-input"
        placeholder="Paste your Gemini API key here"
      />
      <button id="save-key-btn">Save Key</button>
      <p id="save-status"></p>
    </div>

    <!-- type="module" lets popup.js use ES module imports -->
    <script type="module" src="popup.js"></script>
  </body>
</html>
